<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Магазин товаров — интерактивная страница на чистом JavaScript + DOM API.">
    <title>Мой магазин — Акерке Анарбаева</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>🛒 Мой магазин</h1>
        <p>Лаба 5 — DOM, события, формы</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>Добавить товар</h2>
            <form id="product-form" novalidate>
                <div class="field">
                    <label for="name">Название</label>
                    <input type="text" id="name" placeholder="Например: Монитор">
                    <span class="error" id="name-error"></span>
                </div>

                <div class="field">
                    <label for="price">Цена (₸)</label>
                    <input type="number" id="price" min="1" placeholder="15000">
                    <span class="error" id="price-error"></span>
                </div>

                <div class="field">
                    <label for="qty">Количество</label>
                    <input type="number" id="qty" min="1" placeholder="1">
                    <span class="error" id="qty-error"></span>
                </div>

                <button type="submit" class="btn">Добавить</button>
            </form>
        </section>
        <section class="list-section">
            <h2>Товары</h2>
            <table class="products">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Цена</th>
                        <th>Кол-во</th>
                        <th>Сумма</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="product-list">
                </tbody>
            </table>

            <div class="total-row">
                Итого: <strong id="total">0 ₸</strong>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 Акерке Анарбаева — IT1-2310</p>
    </footer>

    <script type="module" src="src/app.js"></script>
</body>

</html>
